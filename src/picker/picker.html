<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Thundergif</title>
    <link rel="stylesheet" href="picker.css" />
    <script type="module" src="picker-main.js"></script>
  </head>
  <body>
    <main class="picker">
      <fieldset class="providers" aria-label="Provider" hidden></fieldset>
      <form class="search" role="search">
        <input type="search" name="q" aria-label="Search" placeholder="Search" autocomplete="off" disabled />
        <button type="submit" class="search-button" aria-label="Search" title="Search">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M10 10l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </form>
      <div class="tabs" role="tablist" aria-label="Show">
        <button type="button" role="tab" class="browse" aria-selected="true">GIFs</button>
        <button type="button" role="tab" class="favourites" aria-selected="false">Favourites</button>
      </div>
      <p class="note" hidden>This email is plain text, so Thundergif will paste a link to the GIF.</p>
      <p class="message" role="status" hidden></p>
      <ul class="grid" aria-label="GIFs"></ul>
      <button type="button" class="more" hidden>More</button>
      <footer>
        <button type="button" class="settings">Settings</button>
        <span class="attribution" hidden></span>
      </footer>
    </main>
  </body>
</html>
