<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Thundergif settings</title>
    <link rel="stylesheet" href="settings.css" />
    <script type="module" src="settings-main.js"></script>
  </head>
  <body>
    <form class="settings">
      <label for="giphy-key">GIPHY Provider key</label>
      <input id="giphy-key" name="giphy" type="text" autocomplete="off" spellcheck="false" />
      <label for="klipy-key">KLIPY Provider key</label>
      <input id="klipy-key" name="klipy" type="text" autocomplete="off" spellcheck="false" />
      <label for="rating">Rating</label>
      <select id="rating" name="rating"></select>
      <button type="submit">Save</button>
      <p class="status" role="status"></p>
    </form>
    <section class="access" aria-label="Access to Providers"></section>
  </body>
</html>
